# YOLOv5s-ASPP Architecture Configuration (ASPP Ablation Variant)

nc: 1 # number of classes (nodule)
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# Backbone
backbone:
  - [-1, 1, Conv, [64, 6, 2, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C3, [128]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C3, [256]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 9, C3, [512]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C3, [1024]] # 8
  - [-1, 1, ASPP, [1024, [1, 3, 5, 7]]] # 9: ASPP substituted for SPPF module

# Head
head:
  - [-1, 1, Conv, [512, 1, 1]] # 10
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: fuse with backbone P4 features
  - [-1, 3, C3, [512, False]] # 13
  - [-1, 1, Conv, [256, 1, 1]] # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [[-1, 4], 1, Concat, [1]] # 16: fuse with backbone P3 features
  - [-1, 3, C3, [256, False]] # 17: P3 head
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19: merge with P4 head features
  - [-1, 3, C3, [512, False]] # 20: P4 head
  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 9], 1, Concat, [1]] # 22: merge with P5 features (layer 9 ASPP)
  - [-1, 3, C3, [1024, False]] # 23: P5 head
  - [[17, 20, 23], 1, Detect, [nc, anchors]] # 24
